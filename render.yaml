services:
  - type: web
    name: population-management-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: population-management-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

databases:
  - name: population-management-db
    plan: starter
    databaseName: population_db
    user: admin
